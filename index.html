<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e9e4d8" />
    <meta name="description" content="可在同一画布中切换的 p5.js 生成艺术工作区。" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2311182d'/%3E%3Cpath d='M7 20c4-7 9-9 18-5-5 0-7 5-13 5H7Z' fill='%23c5a56a'/%3E%3C/svg%3E" />
    <title>飞鸟实验室</title>
  </head>
  <body>
    <main id="workspace-app">
      <div id="project-host" aria-live="polite"></div>

      <aside id="workspace-sidebar" class="workspace-sidebar" data-collapsed="false">
        <div class="sidebar-header">
          <a class="workspace-brand" href="./" aria-label="返回飞鸟实验室首页">
            <span class="brand-mark" aria-hidden="true">✳</span>
            <span class="workspace-brand-copy">
              <strong data-role="workspace-title">飞鸟实验室</strong>
              <small>P5 GENERATIVE LAB</small>
            </span>
          </a>
          <button
            id="sidebar-toggle"
            class="sidebar-toggle"
            type="button"
            aria-expanded="true"
            aria-controls="workspace-sidebar-content"
            aria-label="收起工程目录"
          >
            <span data-role="sidebar-toggle-icon" aria-hidden="true">‹</span>
          </button>
        </div>
        <div id="workspace-sidebar-content" class="workspace-sidebar-content">
          <nav id="project-directory" class="project-directory" aria-label="工程目录">
            <p class="directory-label">PROJECT DIRECTORY</p>
            <div id="project-directory-list" class="project-directory-list"></div>
          </nav>
          <output id="workspace-status" class="workspace-status" aria-live="polite" hidden></output>
        </div>
      </aside>

      <div id="workspace-loading" class="workspace-feedback" role="status" aria-live="polite">
        <span class="feedback-spinner" aria-hidden="true"></span>
        <span>正在载入工程</span>
      </div>

      <div id="workspace-error" class="workspace-feedback workspace-error" role="alert" hidden>
        <strong>工程载入失败</strong>
        <span id="workspace-error-message">请重新选择一个工程。</span>
      </div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
